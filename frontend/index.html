<!DOCTYPE html>
<html>
<head>
    <title>SimsMerged - Final Boss Automation</title>
    <style>
        body { margin: 0; padding: 0; background-color: #02050a; color: #00ffff; font-family: 'Courier New', monospace; overflow: hidden; }
        #main-container { display: flex; height: 100vh; width: 100vw; }
        
        #sidebar { 
            width: 320px; background: #c0c0c0; border: 2px solid #fff; 
            border-right: 2px solid #808080; border-bottom: 2px solid #808080;
            display: flex; flex-direction: column; padding: 5px; z-index: 100;
            box-shadow: inset 1px 1px #dfdfdf, inset -1px -1px #0a0a0a;
        }
        .sidebar-header { 
            background: linear-gradient(90deg, #000080, #1084d0); color: white;
            padding: 3px 5px; font-size: 12px; font-weight: bold; margin-bottom: 5px;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .paint-palette {
            display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
            background: #808080; padding: 2px; border: 1px solid #fff;
        }
        .tool-btn { 
            background: #c0c0c0; border: 1px solid #fff; border-right: 1px solid #808080;
            border-bottom: 1px solid #808080; color: #000; padding: 4px; 
            cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 5px;
        }
        .tool-btn:active, .tool-btn.active {
            border: 1px solid #808080; border-right: 1px solid #fff; border-bottom: 1px solid #fff;
            background: #dfdfdf;
        }

        #msn-chat-container {
            flex-grow: 1; background: #fff; border: 1px solid #808080; margin-top: 10px;
            display: flex; flex-direction: column; font-family: 'Tahoma', sans-serif;
            font-size: 11px;
        }
        .msn-header { background: #dfdfdf; padding: 2px 5px; border-bottom: 1px solid #808080; font-weight: bold; color: #000080; }
        #msn-log { flex-grow: 1; overflow-y: auto; padding: 5px; color: #333; background: #fff; }
        .msn-entry { margin-bottom: 3px; }
        .msn-name { font-weight: bold; color: #cc0000; }

        /* Atmospheric Overlays */
        #scanner-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none; z-index: 400; opacity: 0.15;
        }
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 120%);
            pointer-events: none; z-index: 401;
        }

        #viewport { flex-grow: 1; position: relative; background: #000500 url('assets/DESKTOP_BG.png') center/cover; }
        canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 10; }
        
        #desktop-icons {
            position: absolute; top: 20px; right: 20px; display: grid; grid-template-columns: 1fr; gap: 15px; z-index: 20;
        }
        .desktop-icon {
            display: flex; flex-direction: column; align-items: center; color: white; font-size: 10px; cursor: pointer;
        }
        .icon-box { width: 32px; height: 32px; background: #007acc; border: 1px solid #fff; margin-bottom: 3px; }
        
        #hud-top {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8);
            padding: 12px; border: 1px solid #00ffff; font-size: 14px; z-index: 50;
        }

        /* Hover Tooltip - Information Veil */
        #hover-tooltip {
            position: absolute; display: none; pointer-events: none;
            background: rgba(0, 10, 20, 0.95); border: 2px solid #00ffff;
            padding: 15px; width: 300px; z-index: 300;
            box-shadow: 0 0 20px rgba(0,255,255,0.4);
            font-family: 'Courier New', monospace;
        }
        .tooltip-header { font-size: 16px; font-weight: bold; color: #fff; border-bottom: 1px solid #00ffff; margin-bottom: 10px; padding-bottom: 5px; }
        .tooltip-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
        .tooltip-label { color: #888; }
        .tooltip-value { color: #0f0; text-align: right; }
        .tooltip-desc { margin-top: 10px; font-size: 11px; color: #ccc; line-height: 1.4; border-top: 1px solid #333; padding-top: 10px; }

        /* Legend HUD */
        #legend {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(0, 5, 10, 0.9); border: 1px solid #00ffff;
            padding: 15px; font-size: 12px; pointer-events: none; z-index: 100;
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; color: #ccc; }
        .legend-color { width: 10px; height: 10px; margin-right: 8px; border: 1px solid #fff; }

        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .modal-content { background: #111; border: 2px solid #00ffff; margin: 10% auto; padding: 20px; width: 50%; color: #ccc; font-size: 12px; max-height: 70vh; overflow-y: auto; }
        .close-modal { float: right; color: #f00; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="sidebar">
            <div class="sidebar-header">SIMS_MERGED v1.3 - MS PAINT EDITION</div>
            <div style="font-size: 11px; color: #0f0; margin-bottom: 5px;">ACTIVE: <span id="active-tool-display">CPU CORE</span></div>
            
            <div id="parameter-suite" style="background: rgba(255,255,255,0.1); border: 1px inset #808080; padding: 10px; margin-bottom: 15px; font-size: 11px; color: #000; max-height: 250px; overflow-y: auto;">
                <div style="color: #444;">Select a tool to configure parameters...</div>
            </div>

            <div class="paint-palette" id="build-tools">
                <button class="tool-btn active" data-type="CPU" draggable="true">CORE</button>
                <button class="tool-btn" data-type="RAM" draggable="true">RAM</button>
                <button class="tool-btn" data-type="SSD" draggable="true">SSD</button>
                <button class="tool-btn" data-type="GPU" draggable="true">GPU</button>
                <button class="tool-btn" data-type="NORTHBRIDGE" draggable="true">NORTH</button>
                <button class="tool-btn" data-type="SOUTHBRIDGE" draggable="true">SOUTH</button>
                <button class="tool-btn" data-type="REGISTRY" draggable="true">REG</button>
                <button class="tool-btn" data-type="LLM" draggable="true">AI_NODE</button>
                <button class="tool-btn" data-type="AGENT" draggable="true">PERSON</button>
                <button class="tool-btn" data-type="VDB" draggable="true">DATA_DB</button>
                <button class="tool-btn" data-type="PLANT" draggable="true">FACTORY</button>
                <button class="tool-btn" data-type="SCHOOL" draggable="true">SCHOOL</button>
                <button class="tool-btn" data-type="HOSPITAL" draggable="true">HOSPITAL</button>
                <button class="tool-btn" data-type="BANK" draggable="true">BANK</button>
                <button class="tool-btn" data-type="HOUSE" draggable="true">HOUSE</button>
                <button class="tool-btn" data-type="TREE" draggable="true">TREES</button>
                <button class="tool-btn" data-type="WATER" draggable="true">WATER</button>
                <button class="tool-btn" data-type="ROAD" draggable="true">ROAD</button>
                <button class="tool-btn" data-type="RESEARCH" draggable="true">RESEARCH</button>
            </div>
            
            <div id="msn-chat-container">
                <div class="msn-header">MSN Metropolis (Live)</div>
                <div id="msn-log"></div>
            </div>
        </div>
        
        <div id="viewport">
            <div id="scanner-overlay"></div>
            <div id="vignette"></div>
            <div id="hud-top">
                HOST_MACHINE: <span id="telemetry-status" style="color:#0f0;">CONNECTED</span><br>
                CPU_CLOCK: <span id="cpu-clock" style="color:#0f0;">-- GHz</span><br>
                CRYPTO_MINT: <span id="mint-rate">0.00 SPRITE/s</span><br>
                BALANCE: <span id="crypto-balance" style="color:#ffd700; font-weight:bold;">0.00</span>
            </div>
            <div id="hover-tooltip"></div>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>
    
    <script src="js/telemetry_data.js"></script>
    <script src="js/console.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/resource_monitor.js"></script>
    <script src="js/bridge.js"></script>
    
    <script>
        const toolDisplay = document.getElementById('active-tool-display');
        const buildButtons = document.querySelectorAll('.tool-btn');
        const paramSuite = document.getElementById('parameter-suite');
        
        window.currentSettings = {};

        function renderSetting(v, container) {
            const row = document.createElement('div');
            row.style.marginBottom = '10px';
            const labelContainer = document.createElement('div');
            labelContainer.style.display = 'flex'; labelContainer.style.justifyContent = 'space-between';
            const label = document.createElement('label'); label.innerText = v.label;
            const readout = document.createElement('span'); readout.id = `readout-${v.id}`;
            readout.style.color = '#000080'; readout.innerText = v.val;
            labelContainer.appendChild(label); labelContainer.appendChild(readout);
            row.appendChild(labelContainer);
            
            let input;
            if (v.type === 'range') {
                input = document.createElement('input'); input.type = 'range';
                input.min = v.min; input.max = v.max; input.step = v.step || 1;
                input.value = v.val; input.style.width = '100%';
            } else if (v.type === 'checkbox') {
                input = document.createElement('input'); input.type = 'checkbox';
                input.checked = v.val; readout.innerText = v.val ? 'ON' : 'OFF';
            } else {
                input = document.createElement('input'); input.type = 'text';
                input.value = v.val; input.style.width = '100%'; input.style.fontSize = '10px';
            }

            input.oninput = input.onchange = () => {
                const val = input.type === 'checkbox' ? input.checked : input.value;
                window.currentSettings[v.id] = val;
                readout.innerText = input.type === 'checkbox' ? (val ? 'ON' : 'OFF') : val;
            };
            window.currentSettings[v.id] = v.val;
            row.appendChild(input); container.appendChild(row);
        }

        function updateParamSuite(type) {
            paramSuite.innerHTML = `<div style="font-weight:bold; margin-bottom:8px; color:#000080; border-bottom:1px solid #808080;">${type} PARAMS</div>`;
            if (type === 'RESEARCH') {
                const row = document.createElement('div');
                row.innerHTML = '<input type="text" id="task-id" value="TASK_1" style="width:70%"><button id="load-research">LOAD</button>';
                paramSuite.appendChild(row);
                document.getElementById('load-research').onclick = async () => {
                    const id = document.getElementById('task-id').value;
                    const res = await fetch('http://localhost:8000/api/research-features');
                    const data = await res.json();
                    if(data[id]) {
                        paramSuite.innerHTML = '';
                        data[id].forEach(v => renderSetting(v, paramSuite));
                    }
                };
                return;
            }
            // Add other static types here if needed
        }

        buildButtons.forEach(btn => {
            btn.onclick = function() {
                const type = this.getAttribute('data-type');
                buildButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                toolDisplay.innerText = this.innerText;
                updateParamSuite(type);
                if (window.setBuildType) window.setBuildType(type);
            };
            btn.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', btn.getAttribute('data-type'));
            });
        });

        window.msnChat = function(name, msg) {
            const log = document.getElementById('msn-log');
            if(!log) return;
            const div = document.createElement('div');
            div.className = 'msn-entry';
            div.innerHTML = `<span class="msn-name">${name}:</span> ${msg}`;
            log.appendChild(div); log.scrollTop = log.scrollHeight;
        };

        updateParamSuite('CPU');
    </script>
</body>
</html>
