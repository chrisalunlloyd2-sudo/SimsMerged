<!DOCTYPE html>
<html>
<head>
    <title>SimsMerged - Final Boss Automation</title>
    <style>
        body { margin: 0; padding: 0; background-color: #02050a; color: #00ffff; font-family: 'Courier New', monospace; overflow: hidden; }
        #main-container { display: flex; height: 100vh; width: 100vw; }
        
        #sidebar { 
            width: 320px; background: #c0c0c0; border: 2px solid #fff; 
            border-right: 2px solid #808080; border-bottom: 2px solid #808080;
            display: flex; flex-direction: column; padding: 5px; z-index: 100;
            box-shadow: inset 1px 1px #dfdfdf, inset -1px -1px #0a0a0a;
        }
        .sidebar-header { 
            background: linear-gradient(90deg, #000080, #1084d0); color: white;
            padding: 3px 5px; font-size: 12px; font-weight: bold; margin-bottom: 5px;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .paint-palette {
            display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
            background: #808080; padding: 2px; border: 1px solid #fff;
        }
        .tool-btn { 
            background: #c0c0c0; border: 1px solid #fff; border-right: 1px solid #808080;
            border-bottom: 1px solid #808080; color: #000; padding: 4px; 
            cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 5px;
        }
        .tool-btn:active, .tool-btn.active {
            border: 1px solid #808080; border-right: 1px solid #fff; border-bottom: 1px solid #fff;
            background: #dfdfdf;
        }

        #msn-chat-container {
            flex-grow: 1; background: #fff; border: 1px solid #808080; margin-top: 10px;
            display: flex; flex-direction: column; font-family: 'Tahoma', sans-serif;
            font-size: 11px;
        }
        .msn-header { background: #dfdfdf; padding: 2px 5px; border-bottom: 1px solid #808080; font-weight: bold; color: #000080; }
        #msn-log { flex-grow: 1; overflow-y: auto; padding: 5px; color: #333; background: #fff; }
        .msn-entry { margin-bottom: 3px; }
        .msn-name { font-weight: bold; color: #cc0000; }

        #cyber-console { display: none; } /* Replaced by MSN */

        /* Atmospheric Overlays */
        #scanner-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none; z-index: 400; opacity: 0.15;
        }
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 120%);
            pointer-events: none; z-index: 401;
        }

        #viewport { flex-grow: 1; position: relative; background: #000500; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #hud-top {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8);
            padding: 12px; border: 1px solid #00ffff; font-size: 14px; z-index: 50;
        }

        /* Hover Tooltip - Information Veil */
        #hover-tooltip {
            position: absolute; display: none; pointer-events: none;
            background: rgba(0, 10, 20, 0.95); border: 2px solid #00ffff;
            padding: 15px; width: 300px; z-index: 300;
            box-shadow: 0 0 20px rgba(0,255,255,0.4);
            font-family: 'Courier New', monospace;
        }
        .tooltip-header { font-size: 16px; font-weight: bold; color: #fff; border-bottom: 1px solid #00ffff; margin-bottom: 10px; padding-bottom: 5px; }
        .tooltip-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
        .tooltip-label { color: #888; }
        .tooltip-value { color: #0f0; text-align: right; }
        .tooltip-desc { margin-top: 10px; font-size: 11px; color: #ccc; line-height: 1.4; border-top: 1px solid #333; padding-top: 10px; }

        /* Legend HUD */
        #legend {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(0, 5, 10, 0.9); border: 1px solid #00ffff;
            padding: 15px; font-size: 12px; pointer-events: none; z-index: 100;
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; color: #ccc; }
        .legend-color { width: 10px; height: 10px; margin-right: 8px; border: 1px solid #fff; }

        /* Admin Modal Styles */
        .modal {
            display: none; position: fixed; z-index: 200; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.9);
        }
        .modal-content {
            background: #111; border: 2px solid #00ffff; margin: 10% auto;
            padding: 20px; width: 50%; color: #ccc; font-size: 12px;
            max-height: 70vh; overflow-y: auto;
        }
        .close-modal { float: right; color: #f00; cursor: pointer; font-weight: bold; }
        .boring-section { border-bottom: 1px solid #333; margin-bottom: 15px; padding-bottom: 10px; }
        .boring-title { color: #0ff; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>

        window.currentSettings = {};

        function renderSetting(v, container) {
            const row = document.createElement('div');
            row.style.marginBottom = '10px';
            
            const labelContainer = document.createElement('div');
            labelContainer.style.display = 'flex';
            labelContainer.style.justifyContent = 'space-between';
            
            const label = document.createElement('label');
            label.innerText = v.label;
            
            const valueReadout = document.createElement('span');
            valueReadout.id = eadout- + v.id;
            valueReadout.style.color = '#0f0';
            valueReadout.innerText = v.val;
            
            labelContainer.appendChild(label);
            labelContainer.appendChild(valueReadout);
            row.appendChild(labelContainer);
            
            let input;
            if (v.type === 'range') {
                input = document.createElement('input');
                input.type = 'range';
                input.min = v.min;
                input.max = v.max;
                if(v.step) input.step = v.step;
                input.value = v.val;
                input.style.width = '100%';
                input.style.cursor = 'pointer';
            } else if (v.type === 'checkbox') {
                input = document.createElement('input');
                input.type = 'checkbox';
                input.checked = v.val;
                valueReadout.innerText = v.val ? 'ON' : 'OFF';
            } else {
                input = document.createElement('input');
                input.type = v.type;
                input.value = v.val;
                input.style.width = '100%';
                input.style.background = '#000';
                input.style.color = '#0f0';
                input.style.border = '1px solid #005555';
                input.style.padding = '2px';
                input.style.fontSize = '10px';
            }

            input.oninput = input.onchange = () => {
                const finalVal = input.type === 'checkbox' ? input.checked : input.value;
                window.currentSettings[v.id] = finalVal;
                valueReadout.innerText = input.type === 'checkbox' ? (finalVal ? 'ON' : 'OFF') : finalVal;
                console.log("PARAM_SYNC:", v.id, finalVal);
            };
            
            window.currentSettings[v.id] = v.val;
            row.appendChild(input);
            container.appendChild(row);
        }

        function updateParamSuite(type) {
            paramSuite.innerHTML = `<div style="font-weight:bold; margin-bottom:10px; color:#0ff; border-bottom:1px solid #005555; padding-bottom:5px;">${type} SYSTEM VARIABLES</div>`;
            window.currentSettings = {};

            if (type === 'RESEARCH') {
                const inputRow = document.createElement('div');
                inputRow.innerHTML = '<label>Task ID (e.g., TASK_1 to TASK_2700):</label><br><input type="text" id="research-task-id" value="TASK_1" style="width:100%; background:#000; color:#0f0; border:1px solid #005555; margin-top:5px; margin-bottom:5px;">';
                
                const loadBtn = document.createElement('button');
                loadBtn.innerText = 'LOAD RESEARCH PARAMS (15)';
                loadBtn.style = 'width:100%; background:#005555; color:#fff; border:none; margin-bottom:10px; padding:5px; cursor:pointer; font-weight:bold;';
                
                const resultsDiv = document.createElement('div');
                
                loadBtn.onclick = async () => {
                    resultsDiv.innerHTML = '<span style="color:#888;">Fetching hyperparams...</span>';
                    try {
                        const res = await fetch('http://127.0.0.1:8000/api/research-features');
                        const data = await res.json();
                        const taskId = document.getElementById('research-task-id').value;
                        const taskData = data[taskId];
                        if (taskData) {
                            resultsDiv.innerHTML = '';
                            taskData.forEach(v => renderSetting(v, resultsDiv));
                            window.logToConsole('RESEARCH: Loaded parameters for ' + taskId);
                        } else {
                            resultsDiv.innerHTML = '<span style="color:#f00;">Task not found in DB.</span>';
                        }
                    } catch(e) {
                        resultsDiv.innerHTML = '<span style="color:#f00;">Backend API Error. Is it running?</span>';
                    }
                };
                
                paramSuite.appendChild(inputRow);
                paramSuite.appendChild(loadBtn);
                paramSuite.appendChild(resultsDiv);
                return;
            }

            const vars = COMPONENT_VARS[type] || [];
            vars.forEach(v => renderSetting(v, paramSuite));
        }

                <div class="boring-section">
                    <div class="boring-title">LEGAL / COMPLIANCE</div>
                    <p style="font-size:9px; color:#555;">This software is provided as-is for architectural simulation purposes. All simulated "Agents" are autonomous entities. System corruption simulations are for educational purposes only.</p>
                </div>
            `
        };

        document.getElementById('options-btn').onclick = () => showBoring('OPTIONS');
        document.getElementById('help-btn').onclick = () => showBoring('HELP');
        document.getElementById('about-btn').onclick = () => showBoring('ABOUT');
        closeModal.onclick = () => modal.style.display = 'none';

        function showBoring(type) {
            modalBody.innerHTML = BORING_CONTENT[type];
            modal.style.display = 'block';
            window.logToConsole("UI_LOG: Opened " + type + " dialog.");
        }

        window.logToConsole = function(msg, type) {
            const con = document.getElementById('console');
            if(!con) return;
            const div = document.createElement('div');
            div.className = 'log-entry';
            if(type === 'warn') div.style.color = '#ff0';
            div.innerText = "[" + new Date().toLocaleTimeString() + "] " + msg;
            con.appendChild(div);
            con.scrollTop = con.scrollHeight;
        };

        window.logToConsole("SYSTEM_BOOT: GUI Logic Initialized.");
    </script>
</body>
</html>
