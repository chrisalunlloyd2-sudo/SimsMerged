<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimsMerged Metropolis - God Hand Interface</title>
    <!-- Phase 1: CSS Namespace Locking -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 
      PHASE 1 DOM STRUCTURE
      Separating the rendering canvas (WebGL/2D) from the DOM UI layer (Chat/Stats).
    -->
    <div id="sims-app-container">
        <!-- Render Layer -->
        <canvas id="isometric-canvas"></canvas>
        
        <!-- UI Layer (Phase 2 & 4 Hooks) -->
        <div id="ui-layer">
            <header id="top-bar">
                <div class="sys-status">Pulse: <span id="pulse-indicator" class="active">ONLINE</span></div>
                <div class="sys-title">METROPOLIS AUTHORITY</div>
                <div class="sys-economy">Global DePIN Supply: <span id="global-depin">0.00</span></div>
            </header>
            
            <!-- Future MSN Metropolis Chat Hook -->
            <div id="msn-chat-container" class="panel">
                <div class="panel-header">MSN Metropolis Comm-Link</div>
                <div id="chat-messages" class="panel-body"></div>
                <input type="text" id="chat-input" placeholder="Type @AgentName to interrupt..." />
            </div>

            <!-- Future God Hand Tool Palette -->
            <div id="god-hand-tools" class="panel">
                <div class="panel-header">God Hand Controls</div>
                <div class="panel-body">
                    <button class="gh-btn" id="btn-pause">PAUSE MATRIX</button>
                    <button class="gh-btn" id="btn-spawn">SPAWN AGENT</button>
                    <button class="gh-btn" id="btn-fund">INJECT DEPIN</button>
                </div>
            </div>
            
            <!-- Agent Inspector Overlay -->
            <div id="agent-inspector" class="panel hidden">
                <div class="panel-header">Dossier: <span id="insp-agent-name">N/A</span></div>
                <div class="panel-body">
                    <p>Status: <span id="insp-status">N/A</span></p>
                    <p>Wallet: <span id="insp-wallet">0.0</span></p>
                    <p>Zone: <span id="insp-zone">0,0,0</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Engine Scripts -->
    <script src="js/state.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
